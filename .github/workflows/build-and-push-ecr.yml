name: Build and Push to ECR

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: my-travelline-backend
  ECR_IMAGE_URI: 947927347939.dkr.ecr.eu-north-1.amazonaws.com/my-travelline-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947927347939:role/github-actions-my-travelline-backend-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ECR_IMAGE_URI }}:${{ github.sha }} .
          docker tag ${{ env.ECR_IMAGE_URI }}:${{ github.sha }} ${{ env.ECR_IMAGE_URI }}:latest
          docker push ${{ env.ECR_IMAGE_URI }}:${{ github.sha }}
          docker push ${{ env.ECR_IMAGE_URI }}:latest
