name: CI/CD

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_IMAGE_URI: 947927347939.dkr.ecr.eu-north-1.amazonaws.com/mytravelline-backend

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mytravelline_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn clean verify -B
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/mytravelline_test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRz
          MEDIA_BUCKET: test-bucket
          ALLOWED_ORIGINS: http://localhost:5173
          AWS_REGION: us-east-1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947927347939:role/github-actions-mytravelline-backend-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.ECR_IMAGE_URI }}:${{ github.sha }} .
          docker tag ${{ env.ECR_IMAGE_URI }}:${{ github.sha }} ${{ env.ECR_IMAGE_URI }}:latest
          docker push ${{ env.ECR_IMAGE_URI }}:${{ github.sha }}
          docker push ${{ env.ECR_IMAGE_URI }}:latest
