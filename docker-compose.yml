version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mytravelline-db
    environment:
      POSTGRES_DB: mytravelline
      POSTGRES_USER: mytravelline
      POSTGRES_PASSWORD: mytravelline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mytravelline"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mytravelline-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/mytravelline
      DB_USER: mytravelline
      DB_PASSWORD: mytravelline
      JWT_SECRET: bXktdHJhdmVsbGluZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yNTY=
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      MEDIA_BUCKET: mytravelline-media-dev
      AWS_REGION: us-east-1
    ports:
      - "8080:8080"

volumes:
  postgres_data:
